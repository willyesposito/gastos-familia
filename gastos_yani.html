<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d45;
    --accent: #8b5cf6;
    --accent-dim: rgba(139,92,246,0.12);
    --green: #10b981;
    --green-dim: rgba(16,185,129,0.12);
    --yellow: #f59e0b;
    --red: #ef4444;
    --text: #f1f5f9;
    --muted: #64748b;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
    /* Categoría colors */
    --c1: #f97316; /* carnicería */
    --c2: #22c55e; /* verdulería */
    --c3: #eab308; /* compras */
    --c4: #3b82f6; /* auto */
    --c5: #8b5cf6; /* transporte */
    --c6: #ec4899; /* limpieza */
    --c7: #64748b; /* cigarros */
    --c8: #06b6d4; /* dietética */
    --c9: #f43f5e; /* extras/manual */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100%;
    /* Patrón sutil de puntos en el fondo */
    background-image: radial-gradient(circle, rgba(59,130,246,0.04) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  /* ── HEADER ── */
  .header {
    padding: 52px 20px 20px;
    background: linear-gradient(180deg, rgba(59,130,246,0.08) 0%, transparent 100%);
    border-bottom: 1px solid var(--border);
  }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .titular { font-size: 11px; color: #8b5cf6; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
  .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .header-date { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 4px; }
  .count-badge {
    background: var(--accent-dim);
    border: 1px solid rgba(59,130,246,0.25);
    color: var(--accent);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    font-family: var(--mono);
  }

  /* ── TOTAL HOY ── */
  .today-total {
    margin: 0 16px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
  }
  .total-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
  .total-value { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--text); }
  .total-value span { font-size: 13px; color: var(--muted); }

  /* ── PANTALLA PRINCIPAL ── */
  .screen { display: none; }
  .screen.active { display: block; animation: slideIn 0.18s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ── GRILLA DE CATEGORÍAS ── */
  .section-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    padding: 0 20px;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 16px 16px;
  }
  .cat-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 8px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .cat-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 2px 2px 0 0;
    opacity: 0.8;
  }
  .cat-btn:active { transform: scale(0.95); }
  .cat-icon { font-size: 26px; line-height: 1; }
  .cat-name { font-size: 11px; font-weight: 600; text-align: center; color: var(--text); line-height: 1.2; }
  .cat-last { font-size: 10px; color: var(--muted); font-family: var(--mono); }

  /* Colores individuales de categorías */
  .cat-btn[data-cat="carniceria"]::before { background: var(--c1); }
  .cat-btn[data-cat="carniceria"] .cat-icon { filter: none; }
  .cat-btn[data-cat="verduleria"]::before { background: var(--c2); }
  .cat-btn[data-cat="compras"]::before { background: var(--c3); }
  .cat-btn[data-cat="auto"]::before { background: var(--c4); }
  .cat-btn[data-cat="transporte"]::before { background: var(--c5); }
  .cat-btn[data-cat="limpieza"]::before { background: var(--c6); }
  .cat-btn[data-cat="cigarros"]::before { background: var(--c7); }
  .cat-btn[data-cat="dietetica"]::before { background: var(--c8); }
  .cat-btn[data-cat="manual"]::before { background: var(--c9); }
  .cat-btn[data-cat="manual"] { border-style: dashed; opacity: 0.7; }

  /* ── PANTALLA DE MONTO ── */
  .monto-screen { padding: 20px 20px 40px; }
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted);
    background: none; border: none; cursor: pointer;
    margin-bottom: 24px; padding: 0;
  }
  .back-btn:active { opacity: 0.6; }

  .cat-header {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 24px;
  }
  .cat-header-icon { font-size: 28px; }
  .cat-header-name { font-size: 16px; font-weight: 700; }
  .cat-header-date { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }

  /* Nombre custom para categoría manual */
  .manual-name-wrap { margin-bottom: 16px; }
  .manual-name-wrap label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; display: block; margin-bottom: 6px; }
  .manual-name-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 16px;
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
  }
  .manual-name-input:focus { outline: none; border-color: var(--accent); }

  /* Teclado numérico */
  .display-amount {
    text-align: center;
    margin-bottom: 24px;
  }
  .display-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
  .display-number {
    font-family: var(--mono);
    font-size: 52px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -2px;
    min-height: 64px;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.1s;
  }
  .display-number.has-value { color: var(--green); }
  .display-prefix { font-size: 28px; color: var(--muted); margin-right: 4px; align-self: flex-start; margin-top: 14px; }

  .numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .num-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 8px;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    font-family: var(--mono);
    cursor: pointer;
    transition: all 0.1s;
    display: flex; align-items: center; justify-content: center;
  }
  .num-btn:active { background: var(--accent-dim); border-color: var(--accent); transform: scale(0.96); }
  .num-btn.del { font-size: 18px; color: var(--muted); }
  .num-btn.zero { grid-column: span 2; }

  .confirm-btn {
    width: 100%;
    background: var(--green);
    border: none;
    border-radius: 16px;
    padding: 18px;
    font-size: 16px;
    font-weight: 700;
    color: #000;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .confirm-btn:disabled { background: var(--surface); color: var(--muted); }
  .confirm-btn:active:not(:disabled) { transform: scale(0.98); }

  /* ── CONFIRMACIÓN FLASH ── */
  .flash-overlay {
    position: fixed; inset: 0;
    background: rgba(16,185,129,0.15);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.15s;
    z-index: 100;
  }
  .flash-overlay.show { opacity: 1; }
  .flash-check { font-size: 80px; transform: scale(0.8); transition: transform 0.2s; }
  .flash-overlay.show .flash-check { transform: scale(1); }

  /* ── HISTORIAL ── */
  .historial-btn {
    position: fixed; bottom: 24px; right: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 10px 16px;
    font-size: 12px; font-weight: 600; color: var(--muted);
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    z-index: 50;
  }
  .historial-btn:active { opacity: 0.7; }

  /* ── PANEL HISTORIAL ── */
  .panel-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 200; display: none; align-items: flex-end;
  }
  .panel-overlay.open { display: flex; }
  .panel {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
    width: 100%;
    max-height: 75vh;
    display: flex; flex-direction: column;
    animation: slideUp 0.22s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .panel-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; flex-shrink: 0; }
  .panel-header {
    padding: 16px 20px 12px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .panel-title { font-size: 15px; font-weight: 700; }
  .panel-actions { display: flex; gap: 10px; }
  .panel-btn {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px;
    font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text);
  }
  .panel-btn.export { background: var(--accent-dim); color: var(--accent); border-color: rgba(59,130,246,0.3); }
  .panel-btn.danger { background: rgba(239,68,68,0.1); color: var(--red); border-color: rgba(239,68,68,0.25); }
  .panel-list { overflow-y: auto; padding: 12px 16px 24px; flex: 1; }

  .gasto-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px;
    background: var(--surface2);
    border-radius: 12px;
    margin-bottom: 7px;
    border-left: 3px solid var(--border);
  }
  .gi-icon { font-size: 20px; flex-shrink: 0; }
  .gi-info { flex: 1; }
  .gi-cat { font-size: 12px; font-weight: 600; }
  .gi-time { font-size: 10px; color: var(--muted); font-family: var(--mono); margin-top: 1px; }
  .gi-amount { font-family: var(--mono); font-size: 14px; font-weight: 500; }
  .gi-del { font-size: 16px; color: var(--muted); cursor: pointer; padding: 4px; flex-shrink: 0; }
  .gi-del:active { color: var(--red); }

  .empty-state {
    text-align: center; padding: 40px 20px;
    color: var(--muted); font-size: 13px; line-height: 1.7;
  }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 10px; display: block; opacity: 0.5; }

  /* resumen por categoría en el panel */
  .cat-summary {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 0 16px 12px; flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }
  .cat-sum-chip {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 10px;
    font-size: 11px; font-weight: 600;
    display: flex; align-items: center; gap: 4px;
  }

  /* Notificación de exportación */
  .export-toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: #000;
    border-radius: 10px; padding: 10px 18px;
    font-size: 13px; font-weight: 700;
    opacity: 0; transition: opacity 0.2s;
    pointer-events: none; white-space: nowrap;
    z-index: 300;
  }
  .export-toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- FLASH de confirmación -->
<div class="flash-overlay" id="flash">
  <div class="flash-check">✅</div>
</div>

<!-- TOAST de exportación -->
<div class="export-toast" id="toast">📁 CSV descargado</div>

<!-- HEADER (siempre visible) -->
<div class="header">
  <div class="header-top">
    <div>
      <div class="titular">Yani</div>
      <h1>Mis Gastos</h1>
      <div class="header-date" id="hdr-date"></div>
    </div>
    <div class="count-badge" id="count-badge">0 hoy</div>
  </div>
  <div class="today-total" style="margin: 14px 0 0;">
    <div>
      <div class="total-label">Total hoy</div>
    </div>
    <div class="total-value"><span>$</span><span id="total-hoy">0</span></div>
  </div>
</div>

<!-- ══ SCREEN: CATEGORÍAS ══ -->
<div class="screen active" id="screen-cats">
  <div class="cat-grid" id="cat-grid">
    <!-- generado por JS -->
  </div>
</div>

<!-- ══ SCREEN: MONTO ══ -->
<div class="screen" id="screen-monto">
  <div class="monto-screen">
    <button class="back-btn" onclick="goBack()">
      <span style="font-size:18px">←</span> Volver
    </button>

    <div class="cat-header" id="cat-header-display">
      <div class="cat-header-icon" id="monto-icon">🛒</div>
      <div>
        <div class="cat-header-name" id="monto-catname">Categoría</div>
        <div class="cat-header-date" id="monto-date"></div>
      </div>
    </div>

    <!-- Solo aparece en "manual" -->
    <div class="manual-name-wrap" id="manual-wrap" style="display:none">
      <label>¿Qué compraste?</label>
      <input class="manual-name-input" id="manual-input" type="text" placeholder="Ej: verdulería del barrio…" autocomplete="off">
    </div>

    <div class="display-amount">
      <div class="display-label">Monto</div>
      <div class="display-number" id="display-num">
        <span class="display-prefix">$</span>
        <span id="display-val">0</span>
      </div>
    </div>

    <div class="numpad">
      <button class="num-btn" onclick="numPress('1')">1</button>
      <button class="num-btn" onclick="numPress('2')">2</button>
      <button class="num-btn" onclick="numPress('3')">3</button>
      <button class="num-btn" onclick="numPress('4')">4</button>
      <button class="num-btn" onclick="numPress('5')">5</button>
      <button class="num-btn" onclick="numPress('6')">6</button>
      <button class="num-btn" onclick="numPress('7')">7</button>
      <button class="num-btn" onclick="numPress('8')">8</button>
      <button class="num-btn" onclick="numPress('9')">9</button>
      <button class="num-btn del" onclick="numPress('del')">⌫</button>
      <button class="num-btn zero" onclick="numPress('0')">0</button>
    </div>

    <button class="confirm-btn" id="confirm-btn" onclick="confirmarGasto()" disabled>
      Guardar gasto
    </button>
  </div>
</div>

<!-- ══ PANEL HISTORIAL ══ -->
<div class="panel-overlay" id="panel-overlay" onclick="cerrarPanel(event)">
  <div class="panel">
    <div class="panel-handle"></div>
    <div class="panel-header">
      <div class="panel-title">Registro</div>
      <div class="panel-actions">
        <button class="panel-btn export" onclick="exportarCSV()">↓ Exportar CSV</button>
        <button class="panel-btn danger" onclick="borrarTodo()">Borrar</button>
      </div>
    </div>
    <div class="cat-summary" id="cat-summary"></div>
    <div class="panel-list" id="panel-list"></div>
  </div>
</div>

<!-- BOTÓN FLOTANTE HISTORIAL -->
<button class="historial-btn" onclick="abrirPanel()">
  📋 <span id="hist-count">0 registros</span>
</button>

<script>
// ══════════════════════════════════════
// DATOS DE CATEGORÍAS
// ══════════════════════════════════════
const TITULAR = 'Yani';
const CATS = [
  { id: 'carniceria', icon: '🥩', name: 'Carnicería',  color: '#f97316' },
  { id: 'verduleria', icon: '🥦', name: 'Verdulería',  color: '#22c55e' },
  { id: 'dietetica',  icon: '🌾', name: 'Dietética',   color: '#06b6d4' },
  { id: 'compras',    icon: '🛒', name: 'Compras',     color: '#eab308' },
  { id: 'auto',       icon: '⛽', name: 'Auto/Nafta',  color: '#3b82f6' },
  { id: 'transporte', icon: '🚇', name: 'Transporte',  color: '#8b5cf6' },
  { id: 'limpieza',   icon: '🧹', name: 'Limpieza',    color: '#ec4899' },
  { id: 'cigarros',   icon: '🚬', name: 'Cigarros',    color: '#64748b' },
  { id: 'manual',     icon: '✏️', name: '+ Otro',      color: '#f43f5e' },
];

// ══════════════════════════════════════
// STORAGE — clave única por titular
// ══════════════════════════════════════
const SK = `gastos_${TITULAR.toLowerCase()}_v1`;

function cargarGastos() {
  try { return JSON.parse(localStorage.getItem(SK) || '[]'); } catch { return []; }
}
function guardarGastos(arr) {
  localStorage.setItem(SK, JSON.stringify(arr));
}

// ══════════════════════════════════════
// ESTADO
// ══════════════════════════════════════
let gastos = cargarGastos();
let catActual = null;
let montoStr = '';

// ══════════════════════════════════════
// INICIALIZACIÓN
// ══════════════════════════════════════
function init() {
  // Header fecha
  const now = new Date();
  document.getElementById('hdr-date').textContent =
    now.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });

  // Construir grilla de categorías
  const grid = document.getElementById('cat-grid');
  CATS.forEach(cat => {
    const last = ultimoGastoCat(cat.id);
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.dataset.cat = cat.id;
    btn.innerHTML = `
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-name">${cat.name}</div>
      ${last ? `<div class="cat-last">$${fmt(last)}</div>` : '<div class="cat-last" style="opacity:0">-</div>'}
    `;
    btn.style.setProperty('--cat-color', cat.color);
    btn.querySelector('::before'); // trigger
    btn.onclick = () => seleccionarCat(cat);
    grid.appendChild(btn);
  });

  actualizarUI();
}

function ultimoGastoCat(catId) {
  const arr = gastos.filter(g => g.cat === catId);
  if (!arr.length) return null;
  return arr[arr.length - 1].monto;
}

// ══════════════════════════════════════
// NAVEGACIÓN
// ══════════════════════════════════════
function seleccionarCat(cat) {
  catActual = cat;
  montoStr = '';
  document.getElementById('monto-icon').textContent = cat.icon;
  document.getElementById('monto-catname').textContent = cat.name;
  document.getElementById('monto-date').textContent =
    new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('display-val').textContent = '0';
  document.getElementById('display-num').classList.remove('has-value');
  document.getElementById('confirm-btn').disabled = true;

  // Campo nombre solo para "manual"
  const manualWrap = document.getElementById('manual-wrap');
  const manualInput = document.getElementById('manual-input');
  if (cat.id === 'manual') {
    manualWrap.style.display = 'block';
    manualInput.value = '';
    setTimeout(() => manualInput.focus(), 300);
  } else {
    manualWrap.style.display = 'none';
  }

  mostrarScreen('screen-monto');
}

function goBack() {
  mostrarScreen('screen-cats');
  montoStr = '';
  catActual = null;
}

function mostrarScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ══════════════════════════════════════
// TECLADO NUMÉRICO
// ══════════════════════════════════════
function numPress(key) {
  if (key === 'del') {
    montoStr = montoStr.slice(0, -1);
  } else if (key === '0' && montoStr === '') {
    return; // no leading zeros
  } else if (montoStr.length < 9) {
    montoStr += key;
  }

  const val = montoStr ? parseInt(montoStr) : 0;
  const display = document.getElementById('display-val');
  const numEl = document.getElementById('display-num');
  display.textContent = fmt(val);
  numEl.classList.toggle('has-value', val > 0);
  document.getElementById('confirm-btn').disabled = val <= 0;

  // Vibración táctil
  if (navigator.vibrate) navigator.vibrate(8);
}

// ══════════════════════════════════════
// CONFIRMAR GASTO
// ══════════════════════════════════════
function confirmarGasto() {
  const monto = parseInt(montoStr);
  if (!monto || !catActual) return;

  let nombre = catActual.name;
  if (catActual.id === 'manual') {
    const inp = document.getElementById('manual-input').value.trim();
    nombre = inp || 'Otro';
  }

  const gasto = {
    id: Date.now(),
    fecha: new Date().toISOString(),
    cat: catActual.id,
    catIcon: catActual.icon,
    nombre,
    monto,
    titular: TITULAR,
  };

  gastos.push(gasto);
  guardarGastos(gastos);

  // Flash de confirmación
  const flash = document.getElementById('flash');
  flash.classList.add('show');
  setTimeout(() => { flash.classList.remove('show'); }, 600);

  if (navigator.vibrate) navigator.vibrate([30, 50, 30]);

  // Volver a categorías
  setTimeout(() => {
    goBack();
    actualizarUI();
    // Actualizar el "último precio" de la categoría
    refreshGrid();
  }, 300);
}

function refreshGrid() {
  // Actualizar subtítulos de la grilla con el último gasto
  document.querySelectorAll('.cat-btn').forEach(btn => {
    const catId = btn.dataset.cat;
    const last = ultimoGastoCat(catId);
    const lastEl = btn.querySelector('.cat-last');
    if (lastEl) lastEl.textContent = last ? `$${fmt(last)}` : '';
  });
}

// ══════════════════════════════════════
// ACTUALIZAR UI (totales, contadores)
// ══════════════════════════════════════
function actualizarUI() {
  const hoy = new Date().toDateString();
  const gastosHoy = gastos.filter(g => new Date(g.fecha).toDateString() === hoy);
  const totalHoy = gastosHoy.reduce((s, g) => s + g.monto, 0);

  document.getElementById('total-hoy').textContent = fmt(totalHoy);
  document.getElementById('count-badge').textContent = `${gastosHoy.length} hoy`;
  document.getElementById('hist-count').textContent = `${gastos.length} registro${gastos.length !== 1 ? 's' : ''}`;
}

// ══════════════════════════════════════
// PANEL HISTORIAL
// ══════════════════════════════════════
function abrirPanel() {
  renderPanel();
  document.getElementById('panel-overlay').classList.add('open');
}

function cerrarPanel(e) {
  if (e.target === document.getElementById('panel-overlay')) {
    document.getElementById('panel-overlay').classList.remove('open');
  }
}

function renderPanel() {
  const list = document.getElementById('panel-list');
  const summary = document.getElementById('cat-summary');

  if (!gastos.length) {
    list.innerHTML = `<div class="empty-state"><span class="empty-icon">📭</span>Sin gastos registrados todavía.<br>Tocá una categoría para empezar.</div>`;
    summary.innerHTML = '';
    return;
  }

  // Resumen por categoría
  const porCat = {};
  gastos.forEach(g => {
    porCat[g.cat] = (porCat[g.cat] || 0) + g.monto;
  });
  summary.innerHTML = Object.entries(porCat).map(([catId, total]) => {
    const cat = CATS.find(c => c.id === catId);
    return `<div class="cat-sum-chip" style="border-color:${cat?.color || '#333'}20;color:${cat?.color || '#fff'}">
      ${cat?.icon || '•'} $${fmt(total)}
    </div>`;
  }).join('');

  // Lista de gastos (más recientes primero)
  const sorted = [...gastos].reverse();
  list.innerHTML = sorted.map(g => {
    const cat = CATS.find(c => c.id === g.cat);
    const fecha = new Date(g.fecha);
    const fechaStr = fecha.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }) +
      ' · ' + fecha.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    return `
      <div class="gasto-item" style="border-left-color:${cat?.color || '#333'}">
        <div class="gi-icon">${g.catIcon}</div>
        <div class="gi-info">
          <div class="gi-cat">${g.nombre}</div>
          <div class="gi-time">${fechaStr}</div>
        </div>
        <div class="gi-amount" style="color:${cat?.color || '#fff'}">$${fmt(g.monto)}</div>
        <div class="gi-del" onclick="borrarGasto(${g.id})">🗑</div>
      </div>`;
  }).join('');
}

function borrarGasto(id) {
  gastos = gastos.filter(g => g.id !== id);
  guardarGastos(gastos);
  actualizarUI();
  renderPanel();
}

function borrarTodo() {
  if (confirm(`¿Borrar todos los gastos de ${TITULAR}? Esta acción no se puede deshacer.`)) {
    gastos = [];
    guardarGastos(gastos);
    actualizarUI();
    renderPanel();
  }
}

// ══════════════════════════════════════
// EXPORTAR CSV
// ══════════════════════════════════════
function exportarCSV() {
  if (!gastos.length) { alert('Sin gastos para exportar.'); return; }

  const header = 'Fecha,Hora,Titular,Categoria,Detalle,Monto';
  const rows = gastos.map(g => {
    const d = new Date(g.fecha);
    const fecha = d.toLocaleDateString('es-AR');
    const hora  = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    return [fecha, hora, g.titular, g.cat, `"${g.nombre}"`, g.monto].join(',');
  });

  const csv = [header, ...rows].join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  const hoy = new Date().toLocaleDateString('es-AR').replace(/\//g, '-');
  a.href = url;
  a.download = `gastos_${TITULAR.toLowerCase()}_${hoy}.csv`;
  a.click();
  URL.revokeObjectURL(url);

  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ══════════════════════════════════════
// HELPERS
// ══════════════════════════════════════
function fmt(n) {
  return Math.round(n).toLocaleString('es-AR');
}

// ══════════════════════════════════════
// ARRANCAR
// ══════════════════════════════════════
init();
</script>
</body>
</html>
